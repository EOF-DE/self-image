<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>给Olivia的小惊喜</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      color: white;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      text-align: center;
    }

    .typewriter {
      font-size: 2em;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid #fff;
      margin: 60px auto 20px;
      width: 80%;
      animation: typing 5s steps(40, end), blink .75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 80% }
    }

    @keyframes blink {
      from, to { border-color: transparent }
      50% { border-color: white }
    }

    .heart {
      width: 15px;
      height: 15px;
      position: absolute;
      background: pink;
      transform: rotate(45deg);
      animation: floatUp 8s linear infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      width: 15px;
      height: 15px;
      background: pink;
      position: absolute;
      border-radius: 50%;
    }

    .heart::before { top: -7.5px; left: 0; }
    .heart::after { left: -7.5px; top: 0; }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(45deg); opacity: 1; }
      100% { transform: translateY(-100vh) rotate(45deg); opacity: 0; }
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background: #ff69b4;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #modal, #surpriseModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      color: black;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      display: none;
    }

    #countdown {
      margin: 20px auto;
      font-size: 1.5em;
      color: #ffd1dc;
    }
  </style>
</head>
<body>
  <audio autoplay loop>
    <source src="mht.mp3" type="audio/mpeg">
  </audio>

  <div class="typewriter">遇见你，是我所有浪漫的开始 💖</div>

  <div id="countdown"></div>

  <button onclick="showModal()">📷 点击查看我们的合照</button>
  <button onclick="showSurprise()">💌 我也喜欢你</button>

  <div id="modal">
    <img src="won.jpg" alt="我们的合照" style="max-width:100%; border-radius:10px;">
    <p>这是我们最美的回忆之一 ❤️</p>
    <button onclick="closeAll()">关闭</button>
  </div>

  <div id="surpriseModal">
    <h2>🌟 惊喜时间 🌟</h2>
    <p>在浩瀚的星空里，我的眼里只有你。愿我们的故事，像星辰一样闪耀不息 ✨</p>
    <button onclick="closeAll()">我也喜欢你</button>
  </div>

  <div class="modal-backdrop" id="backdrop" onclick="closeAll()"></div>

  <script>
    // 爱心动画
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (4 + Math.random() * 4) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }
    setInterval(createHeart, 300);

    // 模态框
    function showModal() {
      document.getElementById('modal').style.display = 'block';
      document.getElementById('backdrop').style.display = 'block';
    }

    function showSurprise() {
      document.getElementById('surpriseModal').style.display = 'block';
      document.getElementById('backdrop').style.display = 'block';
    }

    function closeAll() {
      document.getElementById('modal').style.display = 'none';
      document.getElementById('surpriseModal').style.display = 'none';
      document.getElementById('backdrop').style.display = 'none';
    }

    // 纪念日倒计时（修改下面日期）
    const targetDate = new Date('2025-05-12');
    function updateCountdown() {
      const now = new Date();
      const diff = now - targetDate;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById('countdown').innerText = `我们已经相识 ${days} 天啦 ✨`;
    }
    updateCountdown();
    setInterval(updateCountdown, 86400000);
  </script>
</body>
</html>
